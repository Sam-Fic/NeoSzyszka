name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IS_RELEASE=true
          else
            VERSION="snapshot-${GITHUB_SHA::7}"
            IS_RELEASE=false
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Preparing packages for ${VERSION}"

  flatpak:
    name: Flatpak bundle
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    env:
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust used to vendor dependencies
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.96.1 --no-modify-path
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"
          /root/.cargo/bin/rustc --version
      - name: Vendor Cargo dependencies
        run: cargo vendor
      - name: Install Flatpak Rust SDK extension
        run: flatpak install -y org.freedesktop.Sdk.Extension.rust-stable//24.08
      - name: Build Flatpak repository
        run: flatpak-builder --repo=repo build-dir flatpak/com.github.samfic.szyszka.yml --force-clean
      - name: Export Flatpak bundle
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          BUNDLE="szyszka-${VERSION}.flatpak"
          flatpak build-bundle repo "$BUNDLE" com.github.samfic.szyszka
          test -s "$BUNDLE"
          ls -lh "$BUNDLE"
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v6
        with:
          name: szyszka-${{ needs.metadata.outputs.version }}-flatpak
          path: szyszka-${{ needs.metadata.outputs.version }}.flatpak
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows portable package
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install GTK, libadwaita, Rust and packaging tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ntldd
      - name: Build and assemble portable package
        shell: msys2 {0}
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          APP_ROOT="$PWD/dist/NeoSzyszka"
          APP_BIN="$APP_ROOT/bin"
          mkdir -p "$APP_BIN"

          cargo build --release
          cp target/release/szyszka.exe "$APP_BIN/NeoSzyszka.exe"
          cp LICENSE "$APP_ROOT/LICENSE.txt"
          cp data/icons/com.github.samfic.szyszka.ico "$APP_ROOT/NeoSzyszka.ico"

          # ntldd recursively discovers every non-system DLL used by the executable.
          ntldd -R "$APP_BIN/NeoSzyszka.exe" \
            | sed -nE 's|.*(/mingw64/bin/[^[:space:]]+\.dll).*|\1|p' \
            | sort -u \
            | while IFS= read -r dll; do
                cp -n "$dll" "$APP_BIN/"
              done

          # GTK loads schemas, themes, icons and optional image modules at runtime.
          for directory in \
            "$MINGW_PREFIX/share/glib-2.0/schemas" \
            "$MINGW_PREFIX/share/icons/Adwaita" \
            "$MINGW_PREFIX/share/icons/hicolor" \
            "$MINGW_PREFIX/share/libadwaita-1" \
            "$MINGW_PREFIX/share/gtk-4.0" \
            "$MINGW_PREFIX/etc/fonts" \
            "$MINGW_PREFIX/lib/gdk-pixbuf-2.0" \
            "$MINGW_PREFIX/lib/gtk-4.0"; do
              if [ -d "$directory" ]; then
                destination="$APP_ROOT/${directory#${MINGW_PREFIX}/}"
                mkdir -p "$(dirname "$destination")"
                cp -a "$directory" "$destination"
              fi
            done

          # Runtime modules can themselves depend on DLLs not linked by the executable.
          find "$APP_ROOT/lib" -type f -name '*.dll' -print0 2>/dev/null \
            | while IFS= read -r -d '' module; do
                ntldd -R "$module" \
                  | sed -nE 's|.*(/mingw64/bin/[^[:space:]]+\.dll).*|\1|p' \
                  | sort -u \
                  | while IFS= read -r dll; do
                      cp -n "$dll" "$APP_BIN/"
                    done
              done

          glib-compile-schemas "$APP_ROOT/share/glib-2.0/schemas"

          # Ship the entire GNOME Adwaita symbol/icon theme and hicolor fallback theme.
          # Both `index.theme` files and their caches are required for GTK name resolution.
          test -f "$APP_ROOT/share/icons/Adwaita/index.theme"
          test -f "$APP_ROOT/share/icons/hicolor/index.theme"
          gtk4-update-icon-cache -f -t "$APP_ROOT/share/icons/Adwaita"

          # Provide the application icon through the standard hicolor fallback theme.
          mkdir -p "$APP_ROOT/share/icons/hicolor/scalable/apps" "$APP_ROOT/share/icons/hicolor/1024x1024/apps"
          cp data/icons/com.github.samfic.szyszka.svg "$APP_ROOT/share/icons/hicolor/scalable/apps/com.github.samfic.szyszka.svg"
          cp data/icons/com.github.samfic.szyszka.png "$APP_ROOT/share/icons/hicolor/1024x1024/apps/com.github.samfic.szyszka.png"
          gtk4-update-icon-cache -f -t "$APP_ROOT/share/icons/hicolor"

          cat > "$APP_ROOT/NeoSzyszka.cmd" <<'CMD'
          @echo off
          setlocal
          set "APP_DIR=%~dp0"
          set "PATH=%APP_DIR%bin;%PATH%"
          set "XDG_DATA_HOME=%APP_DIR%share"
          set "XDG_DATA_DIRS=%APP_DIR%share"
          set "GTK_DATA_PREFIX=%APP_DIR%"
          set "GSETTINGS_SCHEMA_DIR=%APP_DIR%share\glib-2.0\schemas"
          start "" "%APP_DIR%bin\NeoSzyszka.exe" %*
          CMD

          ZIP_PATH="$PWD/dist/szyszka-${VERSION}-windows-x86_64.zip"
          APP_ROOT_WINDOWS="$(cygpath -w "$APP_ROOT")"
          ZIP_PATH_WINDOWS="$(cygpath -w "$ZIP_PATH")"
          powershell.exe -NoProfile -Command "Compress-Archive -Path '${APP_ROOT_WINDOWS}' -DestinationPath '${ZIP_PATH_WINDOWS}' -Force"
          test -s "$ZIP_PATH"
          ls -lh "$ZIP_PATH"
      - name: Upload Windows portable package
        uses: actions/upload-artifact@v6
        with:
          name: szyszka-${{ needs.metadata.outputs.version }}-windows-x86_64
          path: dist/szyszka-${{ needs.metadata.outputs.version }}-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS application (${{ matrix.arch }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install GTK, libadwaita and bundling tools
        run: brew install gtk4 libadwaita adwaita-icon-theme hicolor-icon-theme pkg-config dylibbundler
      - name: Build and bundle macOS application
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          rustup default 1.96.1
          cargo build --release

          APP_ROOT="$PWD/dist/NeoSzyszka.app"
          MACOS_DIR="$APP_ROOT/Contents/MacOS"
          FRAMEWORKS_DIR="$APP_ROOT/Contents/Frameworks"
          RESOURCES_DIR="$APP_ROOT/Contents/Resources"
          mkdir -p "$MACOS_DIR" "$FRAMEWORKS_DIR" "$RESOURCES_DIR"

          cp target/release/szyszka "$MACOS_DIR/NeoSzyszka-bin"
          cp LICENSE "$RESOURCES_DIR/LICENSE.txt"

          # Finder and Dock require a native ICNS icon. Generate all standard resolutions from
          # the canonical 1024 px PNG, which itself is generated from the source SVG.
          ICONSET="$PWD/dist/NeoSzyszka.iconset"
          mkdir -p "$ICONSET"
          for spec in \
            '16:16' '16:32@2x' '32:32' '32:64@2x' '128:128' \
            '128:256@2x' '256:256' '256:512@2x' '512:512' '512:1024@2x'; do
              name="${spec%%:*}"
              pixels="${spec#*:}"
              sips -z "${pixels%@2x}" "${pixels%@2x}" data/icons/com.github.samfic.szyszka.png \
                --out "$ICONSET/icon_${name}x${name}${pixels#${pixels%@2x}}.png" >/dev/null
            done
          iconutil -c icns "$ICONSET" -o "$RESOURCES_DIR/NeoSzyszka.icns"
          rm -rf "$ICONSET"

          cat > "$APP_ROOT/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleDisplayName</key><string>NeoSzyszka</string>
            <key>CFBundleExecutable</key><string>NeoSzyszka</string>
            <key>CFBundleIdentifier</key><string>com.github.samfic.szyszka</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleIconFile</key><string>NeoSzyszka</string>
            <key>CFBundleName</key><string>NeoSzyszka</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>VERSION_PLACEHOLDER</string>
            <key>CFBundleVersion</key><string>VERSION_PLACEHOLDER</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/VERSION_PLACEHOLDER/${VERSION}/g" "$APP_ROOT/Contents/Info.plist"

          cat > "$MACOS_DIR/NeoSzyszka" <<'SH'
          #!/bin/sh
          APP_ROOT="$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)"
          export XDG_DATA_HOME="$APP_ROOT/Resources/share"
          export XDG_DATA_DIRS="$APP_ROOT/Resources/share${XDG_DATA_DIRS:+:$XDG_DATA_DIRS}"
          export GTK_DATA_PREFIX="$APP_ROOT/Resources"
          export GSETTINGS_SCHEMA_DIR="$APP_ROOT/Resources/share/glib-2.0/schemas"
          exec "$APP_ROOT/MacOS/NeoSzyszka-bin" "$@"
          SH
          chmod +x "$MACOS_DIR/NeoSzyszka" "$MACOS_DIR/NeoSzyszka-bin"

          # Bundle non-system dylibs and rewrite their install names to the app Frameworks directory.
          dylibbundler -od -b \
            -x "$MACOS_DIR/NeoSzyszka-bin" \
            -d "$FRAMEWORKS_DIR" \
            -p '@executable_path/../Frameworks/'

          # libadwaita and GTK need runtime data in addition to dylibs.
          mkdir -p "$RESOURCES_DIR/share"
          for directory in \
            "$(brew --prefix glib)/share/glib-2.0" \
            "$(brew --prefix gtk4)/share/gtk-4.0" \
            "$(brew --prefix libadwaita)/share/libadwaita-1"; do
              if [ -d "$directory" ]; then
                cp -R "$directory" "$RESOURCES_DIR/share/"
              fi
            done
          glib-compile-schemas "$RESOURCES_DIR/share/glib-2.0/schemas"

          # Copy each complete GNOME theme directly to its standard XDG location. Copying the
          # parent `icons` directory twice could nest the second theme under `icons/icons`.
          mkdir -p "$RESOURCES_DIR/share/icons"
          cp -R "$(brew --prefix adwaita-icon-theme)/share/icons/Adwaita" "$RESOURCES_DIR/share/icons/Adwaita"
          cp -R "$(brew --prefix hicolor-icon-theme)/share/icons/hicolor" "$RESOURCES_DIR/share/icons/hicolor"

          # Rebuild caches after copying the full GNOME icon themes into the application bundle.
          test -f "$RESOURCES_DIR/share/icons/Adwaita/index.theme"
          test -f "$RESOURCES_DIR/share/icons/hicolor/index.theme"
          gtk4-update-icon-cache -f -t "$RESOURCES_DIR/share/icons/Adwaita"

          # The in-app About dialog resolves the application icon through the hicolor fallback theme.
          mkdir -p "$RESOURCES_DIR/share/icons/hicolor/scalable/apps" "$RESOURCES_DIR/share/icons/hicolor/1024x1024/apps"
          cp data/icons/com.github.samfic.szyszka.svg "$RESOURCES_DIR/share/icons/hicolor/scalable/apps/com.github.samfic.szyszka.svg"
          cp data/icons/com.github.samfic.szyszka.png "$RESOURCES_DIR/share/icons/hicolor/1024x1024/apps/com.github.samfic.szyszka.png"
          gtk4-update-icon-cache -f -t "$RESOURCES_DIR/share/icons/hicolor"

          # Ad-hoc signing makes the bundle internally consistent. Distribution signing and notarization
          # can later be added with Apple Developer credentials without changing the package layout.
          codesign --force --deep --sign - "$APP_ROOT"
          codesign --verify --deep --strict "$APP_ROOT"

          DMG_PATH="$PWD/dist/szyszka-${VERSION}-macos-${ARCH}.dmg"
          hdiutil create -volname "NeoSzyszka" -srcfolder "$APP_ROOT" -ov -format UDZO "$DMG_PATH"
          test -s "$DMG_PATH"
          ls -lh "$DMG_PATH"
      - name: Upload macOS application image
        uses: actions/upload-artifact@v6
        with:
          name: szyszka-${{ needs.metadata.outputs.version }}-macos-${{ matrix.arch }}
          path: dist/szyszka-${{ needs.metadata.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: [metadata, flatpak, windows, macos]
    if: needs.metadata.outputs.is_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download all release packages
        uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Generate release notes from AppStream metadata
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 - <<'PY' > /tmp/release-notes.md
          import os
          import xml.etree.ElementTree as ET

          version = os.environ["VERSION"]
          root = ET.parse("data/com.github.samfic.szyszka.metainfo.xml").getroot()
          for release in root.findall(".//release"):
              if release.get("version") != version:
                  continue
              description = release.find("description")
              if description is None:
                  break
              parts = []
              for paragraph in description.findall(".//p"):
                  text = "".join(paragraph.itertext()).strip()
                  if text:
                      parts.append(text)
              for item in description.findall(".//li"):
                  text = "".join(item.itertext()).strip()
                  if text:
                      parts.append(f"- {text}")
              print("\n".join(parts))
              break
          PY
          if [ ! -s /tmp/release-notes.md ]; then
            printf 'Release v%s\n' "$VERSION" > /tmp/release-notes.md
          fi
          cat /tmp/release-notes.md
      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: NeoSzyszka v${{ needs.metadata.outputs.version }}
          body_path: /tmp/release-notes.md
          files: artifacts/**/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
