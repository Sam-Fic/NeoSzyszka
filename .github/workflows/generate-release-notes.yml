name: Generate release notes draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Target semantic version without the v prefix, for example 4.2.0
        required: true
        type: string
      from_tag:
        description: Optional previous release tag; defaults to the latest merged v* tag
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-release-notes-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate canonical release notes
    runs-on: ubuntu-24.04
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      VERSION: ${{ inputs.version }}
      FROM_TAG: ${{ inputs.from_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify LLM configuration
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Missing Actions secret OPENAI_API_KEY." >&2
            echo "Add it before running this workflow; no release has been created." >&2
            exit 1
          fi
      - name: Generate and validate canonical release notes
        run: |
          set -euo pipefail
          args=(--version "$VERSION")
          if [ -n "$FROM_TAG" ]; then
            args+=(--from-tag "$FROM_TAG")
          fi
          python3 scripts/generate_release_notes.py "${args[@]}"
          python3 scripts/generate_release_notes.py --check "release-notes/v${VERSION#v}.md"
      - name: Create review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/release-notes-v${{ inputs.version }}
          delete-branch: true
          commit-message: "docs(release): draft notes for v${{ inputs.version }}"
          title: "docs(release): draft v${{ inputs.version }} notes"
          body: |
            This pull request contains LLM-generated release notes derived from commits since the previous release tag.

            The generator enforces the repository's canonical bilingual Markdown format. Review the factual content before merging; this workflow does not create a tag or publish a release.
          add-paths: release-notes/v${{ inputs.version }}.md
